name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v1.1.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-release:
    name: Build Windows release
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify tag and package version
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $packageVersion = $metadata.packages[0].version
          $tagVersion = $env:RELEASE_TAG -replace '^v', ''
          if ($packageVersion -ne $tagVersion) {
            throw "Tag version '$tagVersion' does not match Cargo version '$packageVersion'."
          }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build optimized executable
        run: cargo build --release --locked

      - name: Package and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $releaseTitleVersion = $tag -replace '^v', ''
          [string[]]$releaseChannelArgs = if ($releaseTitleVersion -match '-') {
            @('--prerelease')
          } else {
            @('--latest')
          }
          $assetBase = "BilDowner-$tag-windows-x86_64"
          $dist = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          $exe = Join-Path $dist "$assetBase.exe"
          $zip = Join-Path $dist "$assetBase.zip"
          $checksums = Join-Path $dist "SHA256SUMS.txt"

          Copy-Item "target/release/bildowner.exe" $exe
          Compress-Archive -Path $exe, "README.md", "LICENSE" -DestinationPath $zip

          $checksumLines = foreach ($file in @($exe, $zip)) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          Set-Content -Path $checksums -Value $checksumLines -Encoding utf8

          gh release create $tag $exe $zip $checksums `
            --verify-tag `
            --title "BilDowner $releaseTitleVersion" `
            --generate-notes `
            @releaseChannelArgs
